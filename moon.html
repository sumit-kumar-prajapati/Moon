<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Solar System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="solar-system">
  <div class="sun"></div>

  <div class="orbit mercury-orbit">
    <div class="planet mercury"></div>
  </div>

  <div class="orbit earth-orbit">
    <div class="planet earth">
      <div class="orbit moon-orbit">
        <div class="planet moon"></div>
      </div>
    </div>
  </div>

  <div class="orbit mars-orbit">
    <div class="planet mars"></div>
  </div>
</div>

<!-- SPEED CONTROL -->
<div class="controls">
   Speed:
  <input type="range" min="0.2" max="3" step="0.1" value="1" id="speed">
</div>

<script>
const slider = document.getElementById("speed");

slider.addEventListener("input", ()=>{
  document.documentElement.style.setProperty("--speed", slider.value);
});
</script>
</body>
</html>
